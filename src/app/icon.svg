<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The favicon: a micro version of the mark, tuned for 16–32px tabs.
       The full three-rule design (apple-icon.png, the og card) reads well
       from 128px up, but at tab size its halo gaps became stray pixels —
       so here: TWO continuous rules, higher contrast, no halo, smaller
       endpoint dots, and the route arc as the dominant shape. Corners
       outside the rounded tile are transparent by construction. -->
  <rect width="32" height="32" rx="7" fill="#0a1120"/>
  <g stroke="#a9b8ce" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <line x1="7" y1="13.5" x2="25" y2="13.5"/>
    <line x1="7" y1="20.5" x2="25" y2="20.5"/>
  </g>
  <path d="M 9.5 20.5 C 10.5 12.5 14 7.5 23.5 13.5" fill="none" stroke="#2b9ec7"
        stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="9.5" cy="20.5" r="1.8" fill="#2b9ec7"/>
  <circle cx="23.5" cy="13.5" r="1.8" fill="#2b9ec7"/>
</svg>
